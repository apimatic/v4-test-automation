name: dxV2 Visual Regression

# Runs the same stages you'd run locally, kept as separate steps so each one's
# log stands on its own:
#
#   1. pnpm generate-docs -- --customer-build ./test-builds/<build>
#   2. pnpm build                   (next build — prerenders every page)
#   3. pnpm start                   (next start, on :3000)
#   4. pnpm test:visual             (Playwright, against that server)
#
# Stage 2 exists because `next dev` was unusable here: it compiles routes on
# demand, and the first request to the 182-page SSG route never finished inside
# a 12-minute budget on this runner. `next build` does that work once, and then
# pages answer in milliseconds. It renders identically — moving the suite from
# dev to production changed zero baselines.
#
# The runner is windows-latest on purpose: the committed baselines were captured
# on win32/Chromium, and font rasterization differs enough across operating
# systems that a ubuntu runner would fail every snapshot.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      portal_ref:
        description: >-
          Portal ref to test. Leave blank to use the commit pinned in
          config/portal-source.json. Set it to a branch (e.g. apimatic-docs) to
          check the latest portal for visual regressions.
        required: false
        type: string
      build:
        description: Which build under test-builds/ to render
        required: false
        default: slack
        type: string

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      PORTAL_PORT: '3000'
      # Keeps the first-run telemetry notice out of the server's cold start.
      NEXT_TELEMETRY_DISABLED: '1'
      PORTAL: ${{ inputs.build || 'slack' }}
      BUILD_DIR: ./test-builds/${{ inputs.build || 'slack' }}
      # Must match the cache path above, and applies to install and test alike.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\.playwright-browsers

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # The portal requires Node >= 24.14.0 (its .nvmrc), and we run its build.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install test dependencies
        run: pnpm install --frozen-lockfile

      # Cached into the workspace rather than the user profile: the default
      # location made actions/cache miss every run, and reinstalling Chromium
      # cost about four minutes each time.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\.playwright-browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      # No --with-deps: that installs OS-level libraries, which is a Linux
      # concern and does nothing but burn minutes on a Windows runner.
      - name: Install Chromium
        run: pnpm exec playwright install chromium

      # Clones the portal app into .portal/ at the pinned commit, installs its
      # dependencies, and builds the workspace packages apps/docs imports from.
      #
      # apimatic-dx-portal-v2 is private, so this needs a credential that can
      # read it — GITHUB_TOKEN is scoped to this repo alone and won't do. The
      # org-level ACTIONS_PAT is what other repos here use for exactly this
      # (see ui-test-automation's cross-repo checkout). Set a repo-level
      # PORTAL_REPO_TOKEN to use something more narrowly scoped instead.
      - name: Set up the portal app
        env:
          PORTAL_REPO_TOKEN: ${{ secrets.PORTAL_REPO_TOKEN || secrets.ACTIONS_PAT }}
          PORTAL_REF: ${{ inputs.portal_ref }}
        run: pnpm setup:portal

      # ---- Step 1: generate the portal from the build fixture
      - name: Generate docs
        run: pnpm generate-docs -- --customer-build ${{ env.BUILD_DIR }}

      # ---- Step 2: prerender the whole portal
      - name: Build the portal
        run: pnpm build

      # ---- Step 3: serve the prerendered output
      # Start-Process detaches it so it outlives this step. `pnpm start` skips
      # generate and build, serving what the two previous steps produced.
      - name: Start the portal server
        shell: pwsh
        run: |
          Start-Process -FilePath 'pnpm.cmd' -ArgumentList 'start' -NoNewWindow `
            -RedirectStandardOutput portal-server.log `
            -RedirectStandardError portal-server.err.log

      # Serving prerendered output, so this is a question of process startup,
      # not compilation — seconds, not minutes.
      #
      # The address is pinned to IPv4 here and in PORTAL_BASE_URL below because
      # `localhost` can resolve to ::1 first on Windows.
      - name: Wait for the portal to answer
        shell: pwsh
        run: |
          $url = "http://127.0.0.1:$env:PORTAL_PORT/docs/getting-started/quickstart"
          $deadline = (Get-Date).AddMinutes(3)
          $attempt = 0
          while ((Get-Date) -lt $deadline) {
            $attempt++
            try {
              $r = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 30
              if ($r.StatusCode -eq 200) {
                Write-Host "portal is up after $attempt attempt(s)"
                exit 0
              }
              Write-Host "attempt $attempt : HTTP $($r.StatusCode)"
            } catch {
              Write-Host "attempt $attempt : not ready yet: $($_.Exception.Message)"
              Start-Sleep -Seconds 3
            }
          }
          Write-Host '--- portal-server.log ---'
          if (Test-Path portal-server.log) { Get-Content portal-server.log }
          Write-Host '--- portal-server.err.log ---'
          if (Test-Path portal-server.err.log) { Get-Content portal-server.err.log }
          throw "Portal did not become ready at $url within 3 minutes"

      # ---- Step 4: the tests
      # PORTAL_BASE_URL makes Playwright treat the portal as externally managed,
      # so its own `webServer` stays out of the way instead of racing us for
      # port 3000 (reuseExistingServer is deliberately off when CI is set).
      - name: Run visual tests
        env:
          # IPv4-pinned for the same reason as the readiness probe above.
          PORTAL_BASE_URL: http://127.0.0.1:3000
        run: pnpm test:visual

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ inputs.build || 'slack' }}
          path: playwright-report/
          retention-days: 30

      # The actual/diff PNGs for anything that failed — the thing you need to
      # decide whether a diff is a regression or an intended change.
      - name: Upload failure screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: failed-snapshots-${{ inputs.build || 'slack' }}
          path: test-results/
          retention-days: 30

      - name: Upload portal server logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: portal-server-logs-${{ inputs.build || 'slack' }}
          path: |
            portal-server.log
            portal-server.err.log
          retention-days: 7
          if-no-files-found: ignore
